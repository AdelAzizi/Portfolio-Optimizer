# 📊 تنظیمات سیستم تحلیل جامع استراتژی‌های سرمایه‌گذاری

# 📁 مسیرهای داده
data_sources:
  strategy_data: "tests/data/strategy_test_results.csv"
  top_strategies: "tests/data/top_300_strategies.csv"
  benchmark_data: "data/benchmark_data_v3.csv"
  walk_forward_data: "tests/walk_forward_analysis_results.csv"
  backtest_1y: "tests/backtest_1year_results.csv"
  backtest_5y: "tests/backtest_5year_results.csv"

# 🎯 پارامترهای تحلیل
analysis_parameters:
  # تحلیل افق‌های زمانی
  prediction_horizons:
    horizons: ["1y", "3y", "5y"]
    confidence_level: 0.05
    correlation_threshold: 0.5
  
  # تحلیل ثبات
  stability_analysis:
    rolling_window: 252  # یک سال
    stability_threshold: 0.2
    consistency_threshold: 0.7
  
  # تحلیل رژیم بازار
  regime_analysis:
    regime_detection_method: "hmm"  # Hidden Markov Model
    n_regimes: 3  # صعودی، نزولی، خنثی
    min_regime_duration: 30  # حداقل 30 روز
  
  # تحلیل ترکیب استراتژی‌ها
  combination_analysis:
    optimization_method: "max_sharpe"
    max_weight: 0.4
    min_weight: 0.05
    monte_carlo_simulations: 10000
  
  # تحلیل حساسیت پارامترها
  sensitivity_analysis:
    parameter_variation_range: 0.2  # ±20%
    sensitivity_threshold: 0.05  # 5% تغییر در Sharpe
    n_sensitivity_points: 11
  
  # تحلیل ریسک پیشرفته
  risk_analysis:
    confidence_levels: [0.01, 0.05, 0.10]
    var_method: "historical"
    stress_scenarios: ["market_crash", "high_volatility", "recession"]
  
  # Walk-Forward Analysis
  walk_forward:
    window_size: 252  # یک سال
    step_size: 63     # یک فصل
    min_observations: 100
    overfitting_threshold: 0.3  # 30% کاهش عملکرد

# 📊 تنظیمات خروجی
output_settings:
  base_directory: "tests/results"
  export_formats: ["json", "html", "pdf"]
  include_visualizations: true
  language: "fa"  # فارسی
  
  # تنظیمات نمودارها
  visualization:
    figure_size: [12, 8]
    dpi: 300
    style: "seaborn-v0_8"
    color_palette: "husl"
    save_format: "png"

# 🔧 تنظیمات سیستم
system_settings:
  # کش
  cache:
    enabled: true
    cache_directory: "tests/cache"
    cache_expiry_hours: 24
    max_cache_size_mb: 1000
  
  # پردازش موازی
  parallel_processing:
    enabled: true
    max_workers: null  # استفاده از تمام هسته‌ها
    timeout_minutes: 30
  
  # لاگینگ
  logging:
    level: "INFO"
    log_file: "tests/results/analysis.log"
    console_output: true
    detailed_errors: true

# 📈 معیارهای موفقیت
success_criteria:
  min_correlation: 0.3
  min_sharpe_ratio: 1.0
  max_drawdown: 0.25
  min_information_ratio: 0.3
  stability_score: 0.6

# 🎨 تنظیمات گزارش
report_settings:
  title: "گزارش تحلیل جامع استراتژی‌های سرمایه‌گذاری"
  author: "سیستم تحلیل هوشمند"
  template_style: "professional"
  include_executive_summary: true
  include_methodology: true
  include_appendix: true
  
  # بخش‌های گزارش
  sections:
    - "executive_summary"
    - "methodology"
    - "prediction_horizons"
    - "stability_analysis"
    - "regime_analysis"
    - "combination_analysis"
    - "sensitivity_analysis"
    - "benchmark_comparison"
    - "risk_analysis"
    - "walk_forward"
    - "economic_factors"
    - "recommendations"
    - "appendix"

# 🚨 تنظیمات هشدار
alerts:
  email_notifications: false
  critical_error_threshold: 3
  performance_degradation_threshold: 0.5
  
# 🔍 تنظیمات دیباگ
debug:
  save_intermediate_results: true
  verbose_logging: false
  profile_performance: false
  validate_data_integrity: true